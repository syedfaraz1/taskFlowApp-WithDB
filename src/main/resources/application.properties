spring.application.name=taskflow
server.port=8080

# MySQL datasource - override via environment variables (see README / docker-compose.yml)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskflow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:taskflow}
spring.datasource.password=${DB_PASSWORD:taskflow}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Actuator - handy for Docker healthchecks later
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
