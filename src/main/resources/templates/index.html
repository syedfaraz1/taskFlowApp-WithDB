<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-decoration"></div>

<div class="app">
    <header class="app-header">
        <div class="brand">
            <div class="brand-mark">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 12L9 17L20 6" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div>
                <h1>TaskFlow</h1>
                <p class="subtitle">Spring Boot &middot; running in your browser right now</p>
            </div>
        </div>
        <div class="stats" id="stats">
            <div class="stat-pill">
                <span class="stat-number" id="totalCount">0</span>
                <span class="stat-label">total</span>
            </div>
            <div class="stat-pill done">
                <span class="stat-number" id="doneCount">0</span>
                <span class="stat-label">done</span>
            </div>
            <div class="stat-pill pending">
                <span class="stat-number" id="pendingCount">0</span>
                <span class="stat-label">pending</span>
            </div>
        </div>
    </header>

    <section class="composer">
        <form id="taskForm">
            <input type="text" id="titleInput" placeholder="What needs to be done?" required maxlength="80">
            <input type="text" id="descInput" placeholder="Description (optional)" maxlength="140">
            <select id="priorityInput">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
            </select>
            <button type="submit" class="btn-primary">
                <span>Add Task</span>
            </button>
        </form>
    </section>

    <section class="board">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <div class="task-list" id="taskList">
            <!-- tasks render here -->
        </div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <p>No tasks here. Add one above &uarr;</p>
        </div>
    </section>

    <footer class="app-footer">
        <p>
            <span>Clone me &mdash; from <code>GITHUB.COM</code> <code>syedfaraz1/taskflow</code></span>
        </p>
        <br>
        <p>
            <span>Docker Image available &mdash; at <code>Docker Hub</code> <code>learningdevop</code></span>
        </p>
    </footer>
</div>

<script src="/js/app.js"></script>
</body>
</html>
